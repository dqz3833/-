name: Probe Fenbi endpoints

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/discover_fenbi_endpoints.py'
      - '.github/workflows/probe-fenbi-endpoints.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scripts/discover_fenbi_endpoints.py | tee fenbi-endpoints.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fenbi-endpoint-probe
          path: |
            build/fenbi_endpoint_probe/report.json
            fenbi-endpoints.log
          retention-days: 7

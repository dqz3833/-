name: Build national core database

on:
  push:
    paths:
      - "scripts/build_national_core.py"
      - ".github/workflows/build-national-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl xlrd requests
      - name: Build national core
        run: python scripts/build_national_core.py
      - name: Show manifest
        if: always()
        run: |
          find build/core -maxdepth 2 -type f -printf '%p %s bytes\n' || true
          cat build/core/national_core_manifest.json || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-core-2024-2026
          path: build/core/
          if-no-files-found: warn
          retention-days: 30

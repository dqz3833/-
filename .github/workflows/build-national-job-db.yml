name: Build verified national job database

on:
  push:
    paths:
      - "scripts/build_national_job_db.py"
      - ".github/workflows/build-national-job-db.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl xlrd beautifulsoup4 lxml requests

      - name: Build database
        run: python scripts/build_national_job_db.py

      - name: Show manifest
        if: always()
        run: |
          find build -maxdepth 2 -type f -printf '%p %s bytes\n' || true
          cat build/national_manifest.json || true

      - name: Upload database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-job-database-2024-2026
          path: |
            build/national_civil_service_2024_2026.sqlite
            build/national_positions_2024_2026.csv.gz
            build/national_manifest.json
            build/README.txt
          if-no-files-found: warn
          retention-days: 30

